# Stack para Portainer: Stacks → Add stack → Web editor → pega esto.
# Cambia solo la contraseña.
services:
  apuntes:
    image: ghcr.io/ivancio-9/apuntes:latest
    restart: unless-stopped
    ports:
      # Solo accesible desde este ordenador; Tailscale lo lleva de forma segura a tu iPad.
      - "127.0.0.1:8080:8080"
    environment:
      APP_PASSWORD: "cambia-esta-contraseña"
    volumes:
      # Aquí se guardan todos tus apuntes.
      - apuntes-datos:/data

volumes:
  apuntes-datos:
