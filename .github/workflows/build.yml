name: Compilar Apuntes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  servidor-y-web:
    name: Servidor + app web (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nombre de la imagen
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/apuntes" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.img.outputs.name }}:latest

  android:
    name: App Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Clave de firma fija (para poder actualizar sin desinstalar)
        run: mkdir -p ~/.android && cp ci/android-debug.keystore ~/.android/debug.keystore
      - name: Preparar proyecto
        run: bash ci/prepare.sh android
      - name: Compilar APK
        working-directory: app
        run: flutter build apk --release
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Apuntes (versión ${{ github.run_number }})
          files: app/build/app/outputs/flutter-apk/app-release.apk
