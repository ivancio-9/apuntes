<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Apuntes a mano y con teclado.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Apuntes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Apuntes</title>
  <link rel="manifest" href="manifest.json">
  <style>html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }</style>
  <script>
    // iPad: la función "Escritura a mano" (Scribble) de iPadOS se queda con parte de los
    // eventos del Apple Pencil y se pierden trazos. Cancelar los eventos táctiles del lápiz
    // lo evita (los eventos de puntero que usa la app siguen llegando).
    (function () {
      function stylus(e) {
        var t = e.changedTouches;
        if (!t) return false;
        for (var i = 0; i < t.length; i++) { if (t[i].touchType === 'stylus') return true; }
        return false;
      }
      function block(e) {
        // No bloquear si se está escribiendo en un campo de texto.
        var a = document.activeElement;
        if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && e.target === a) return;
        if (stylus(e)) e.preventDefault();
      }
      ['touchstart', 'touchmove', 'touchend'].forEach(function (n) {
        document.addEventListener(n, block, { passive: false, capture: true });
      });
    })();

    // Pegar imágenes (Ctrl+V / Cmd+V) desde el portapapeles.
    window.addEventListener('paste', function (e) {
      var items = e.clipboardData && e.clipboardData.items;
      if (!items || !window.apuntesOnImagePaste) return;
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.kind === 'file' && it.type.indexOf('image/') === 0) {
          var f = it.getAsFile();
          if (!f) continue;
          e.preventDefault();
          f.arrayBuffer().then(function (buf) { window.apuntesOnImagePaste(new Uint8Array(buf)); });
          return;
        }
      }
    }, true);

    // Leer una imagen del portapapeles al pulsar el botón "Pegar".
    window.apuntesReadClipboardImage = async function () {
      if (!navigator.clipboard || !navigator.clipboard.read) return null;
      try {
        var items = await navigator.clipboard.read();
        for (var i = 0; i < items.length; i++) {
          for (var j = 0; j < items[i].types.length; j++) {
            var type = items[i].types[j];
            if (type.indexOf('image/') === 0) {
              var blob = await items[i].getType(type);
              return new Uint8Array(await blob.arrayBuffer());
            }
          }
        }
      } catch (err) { console.log('portapapeles:', err); }
      return null;
    };

    // Descargar un archivo generado por la app (PDF, JPG, PNG, ZIP).
    window.apuntesDownload = function (bytes, name, mime) {
      var blob = new Blob([bytes], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name; a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 10000);
    };

    // Convertir PNG a JPG usando el propio navegador (rápido).
    window.apuntesPngToJpg = async function (bytes, quality) {
      var bmp = await createImageBitmap(new Blob([bytes], { type: 'image/png' }));
      var c = document.createElement('canvas');
      c.width = bmp.width; c.height = bmp.height;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(bmp, 0, 0);
      var out = await new Promise(function (r) { c.toBlob(r, 'image/jpeg', quality); });
      return new Uint8Array(await out.arrayBuffer());
    };

    // Elegir un archivo (por ejemplo un PDF). Devuelve sus bytes o null.
    window.apuntesPickFile = function (accept) {
      return new Promise(function (resolve) {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = accept;
        input.style.display = 'none';
        document.body.appendChild(input);
        var done = false;
        input.addEventListener('change', async function () {
          done = true;
          var f = input.files && input.files[0];
          input.remove();
          if (!f) { resolve(null); return; }
          window.apuntesLastFileName = f.name;
          resolve(new Uint8Array(await f.arrayBuffer()));
        });
        input.addEventListener('cancel', function () { if (!done) { input.remove(); resolve(null); } });
        input.click();
      });
    };

    // Convertir cada página de un PDF en una imagen JPG (con pdf.js).
    window.apuntesPdfToImages = async function (bytes, maxWidth, onProgress) {
      var base = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/';
      var pdfjs = await import(base + 'pdf.min.mjs');
      pdfjs.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.mjs';
      var doc = await pdfjs.getDocument({ data: bytes.slice() }).promise;
      var out = [];
      for (var i = 1; i <= doc.numPages; i++) {
        var page = await doc.getPage(i);
        var vp1 = page.getViewport({ scale: 1 });
        var vp = page.getViewport({ scale: maxWidth / vp1.width });
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(vp.width);
        canvas.height = Math.round(vp.height);
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        var blob = await new Promise(function (r) { canvas.toBlob(r, 'image/jpeg', 0.88); });
        out.push(new Uint8Array(await blob.arrayBuffer()));
        if (onProgress) onProgress(i, doc.numPages);
      }
      return out;
    };

    // ---------------------------------------------------------------------------
    // Tinta de baja latencia: el trazo en curso se dibuja aquí directamente (sin esperar
    // al motor de la app), usando todos los puntos del lápiz y prediciendo el siguiente.
    (function () {
      var canvas = null, ctx = null, dpr = 1;
      var pending = null, active = null, strokes = [];
      function ensure() {
        if (canvas) return;
        canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;left:0;top:0;pointer-events:none;z-index:2147483646;';
        document.body.appendChild(canvas);
        resize();
        window.addEventListener('resize', resize);
      }
      function resize() {
        dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(window.innerWidth * dpr);
        canvas.height = Math.round(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx = canvas.getContext('2d');
        redraw();
      }
      function pr(e) {
        if (e.pointerType !== 'pen') return 0.5;
        return e.pressure > 0 ? e.pressure : 0.3;
      }
      function add(s, x, y, p) {
        var a = s.pts, n = a.length;
        if (n >= 3) { var dx = x - a[n - 3], dy = y - a[n - 2]; if (dx * dx + dy * dy < 0.2) return; }
        a.push(x, y, p);
      }
      window.addEventListener('pointerdown', function (e) {
        pending = (e.pointerType === 'pen' || e.pointerType === 'mouse')
          ? { id: e.pointerId, x: e.clientX, y: e.clientY, p: pr(e) } : null;
      }, true);
      window.addEventListener('pointermove', function (e) {
        if (!active || active.done || e.pointerId !== active.id) return;
        var list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
        if (!list || !list.length) list = [e];
        for (var i = 0; i < list.length; i++) add(active, list[i].clientX, list[i].clientY, pr(list[i]));
        var pred = e.getPredictedEvents ? e.getPredictedEvents() : null;
        active.pred = pred && pred.length ? pred[pred.length - 1] : null;
        redraw();
      }, true);
      function endEv(e) {
        if (!active || active.done || e.pointerId !== active.id) return;
        var a = active.pts;
        add(active, e.clientX, e.clientY, a.length ? a[a.length - 1] : 0.5);
        active.done = true;
        active.pred = null;
        redraw();
      }
      window.addEventListener('pointerup', endEv, true);
      window.addEventListener('pointercancel', endEv, true);

      function smooth(a) {
        var n = a.length / 3, out = a.slice();
        for (var i = 1; i < n - 1; i++)
          for (var k = 0; k < 3; k++) out[i * 3 + k] = a[(i - 1) * 3 + k] * 0.25 + a[i * 3 + k] * 0.5 + a[(i + 1) * 3 + k] * 0.25;
        return out;
      }
      function drawStroke(s) {
        var o = s.o, a = s.pts.slice(), n;
        if (!s.done) {
          n = a.length;
          if (s.pred) a.push(s.pred.clientX, s.pred.clientY, a[n - 1]);
          else if (n >= 9) a.push(a[n - 3] + (a[n - 3] - a[n - 6]) * 0.8, a[n - 2] + (a[n - 2] - a[n - 5]) * 0.8, a[n - 1]);
        }
        if (o.straight && a.length > 6) a = [a[0], a[1], a[2], a[a.length - 3], a[a.length - 2], a[a.length - 1]];
        else a = smooth(a);
        n = a.length / 3;
        ctx.save();
        ctx.beginPath();
        ctx.rect(o.l, o.t, o.r - o.l, o.b - o.t);
        ctx.clip();
        ctx.strokeStyle = o.color; ctx.fillStyle = o.color;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        if (!o.pressure) {
          ctx.lineWidth = o.width;
          ctx.beginPath();
          ctx.moveTo(a[0], a[1]);
          if (n === 1) ctx.lineTo(a[0] + 0.01, a[1]);
          for (var i = 1; i < n - 1; i++) ctx.quadraticCurveTo(a[i * 3], a[i * 3 + 1], (a[i * 3] + a[i * 3 + 3]) / 2, (a[i * 3 + 1] + a[i * 3 + 4]) / 2);
          if (n > 1) ctx.lineTo(a[(n - 1) * 3], a[(n - 1) * 3 + 1]);
          ctx.stroke();
        } else {
          if (n === 1) { ctx.beginPath(); ctx.arc(a[0], a[1], o.width * (0.35 + 1.15 * a[2]) / 2, 0, Math.PI * 2); ctx.fill(); }
          for (var j = 0; j < n - 1; j++) {
            ctx.lineWidth = o.width * (0.35 + 1.15 * (a[j * 3 + 2] + a[j * 3 + 5]) / 2);
            ctx.beginPath();
            ctx.moveTo(a[j * 3], a[j * 3 + 1]);
            ctx.lineTo(a[j * 3 + 3], a[j * 3 + 4]);
            ctx.stroke();
          }
        }
        ctx.restore();
      }
      function redraw() {
        if (!ctx) return;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        for (var i = 0; i < strokes.length; i++) drawStroke(strokes[i]);
      }
      window.apuntesInk = {
        begin: function (color, width, pressure, straight, l, t, r, b) {
          ensure();
          if (!pending) return false;
          active = { id: pending.id, pts: [pending.x, pending.y, pending.p], done: false, pred: null,
                     o: { color: color, width: width, pressure: pressure, straight: straight, l: l, t: t, r: r, b: b } };
          pending = null;
          strokes.push(active);
          redraw();
          return true;
        },
        points: function () { return new Float64Array(active ? active.pts : []); },
        clear: function () {
          var s = active;
          if (s) s.done = true;
          requestAnimationFrame(function () { requestAnimationFrame(function () {
            strokes = strokes.filter(function (x) { return x !== s; });
            if (active === s) active = null;
            redraw();
          }); });
        },
        cancel: function () {
          var s = active;
          strokes = strokes.filter(function (x) { return x !== s; });
          active = null;
          redraw();
        }
      };
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
