<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Apuntes a mano y con teclado.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Apuntes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Apuntes</title>
  <link rel="manifest" href="manifest.json">
  <style>html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }</style>
  <script>
    // iPad: la función "Escritura a mano" (Scribble) de iPadOS se queda con parte de los
    // eventos del Apple Pencil y se pierden trazos. Cancelar los eventos táctiles del lápiz
    // lo evita (los eventos de puntero que usa la app siguen llegando).
    (function () {
      function stylus(e) {
        var t = e.changedTouches;
        if (!t) return false;
        for (var i = 0; i < t.length; i++) { if (t[i].touchType === 'stylus') return true; }
        return false;
      }
      function block(e) {
        // No bloquear si se está escribiendo en un campo de texto.
        var a = document.activeElement;
        if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && e.target === a) return;
        if (stylus(e)) e.preventDefault();
      }
      ['touchstart', 'touchmove', 'touchend'].forEach(function (n) {
        document.addEventListener(n, block, { passive: false, capture: true });
      });
    })();

    // Pegar imágenes (Ctrl+V / Cmd+V) desde el portapapeles.
    window.addEventListener('paste', function (e) {
      var items = e.clipboardData && e.clipboardData.items;
      if (!items || !window.apuntesOnImagePaste) return;
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.kind === 'file' && it.type.indexOf('image/') === 0) {
          var f = it.getAsFile();
          if (!f) continue;
          e.preventDefault();
          f.arrayBuffer().then(function (buf) { window.apuntesOnImagePaste(new Uint8Array(buf)); });
          return;
        }
      }
    }, true);

    // Leer una imagen del portapapeles al pulsar el botón "Pegar".
    window.apuntesReadClipboardImage = async function () {
      if (!navigator.clipboard || !navigator.clipboard.read) return null;
      try {
        var items = await navigator.clipboard.read();
        for (var i = 0; i < items.length; i++) {
          for (var j = 0; j < items[i].types.length; j++) {
            var type = items[i].types[j];
            if (type.indexOf('image/') === 0) {
              var blob = await items[i].getType(type);
              return new Uint8Array(await blob.arrayBuffer());
            }
          }
        }
      } catch (err) { console.log('portapapeles:', err); }
      return null;
    };

    // Descargar un archivo generado por la app (PDF, JPG, PNG, ZIP).
    window.apuntesDownload = function (bytes, name, mime) {
      var blob = new Blob([bytes], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name; a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 10000);
    };

    // Convertir PNG a JPG usando el propio navegador (rápido).
    window.apuntesPngToJpg = async function (bytes, quality) {
      var bmp = await createImageBitmap(new Blob([bytes], { type: 'image/png' }));
      var c = document.createElement('canvas');
      c.width = bmp.width; c.height = bmp.height;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(bmp, 0, 0);
      var out = await new Promise(function (r) { c.toBlob(r, 'image/jpeg', quality); });
      return new Uint8Array(await out.arrayBuffer());
    };

    // Elegir un archivo (por ejemplo un PDF). Devuelve sus bytes o null.
    window.apuntesPickFile = function (accept) {
      return new Promise(function (resolve) {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = accept;
        input.style.display = 'none';
        document.body.appendChild(input);
        var done = false;
        input.addEventListener('change', async function () {
          done = true;
          var f = input.files && input.files[0];
          input.remove();
          if (!f) { resolve(null); return; }
          window.apuntesLastFileName = f.name;
          resolve(new Uint8Array(await f.arrayBuffer()));
        });
        input.addEventListener('cancel', function () { if (!done) { input.remove(); resolve(null); } });
        input.click();
      });
    };

    // Convertir cada página de un PDF en una imagen JPG (con pdf.js).
    window.apuntesPdfToImages = async function (bytes, maxWidth, onProgress) {
      var base = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/';
      var pdfjs = await import(base + 'pdf.min.mjs');
      pdfjs.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.mjs';
      var doc = await pdfjs.getDocument({ data: bytes.slice() }).promise;
      var out = [];
      for (var i = 1; i <= doc.numPages; i++) {
        var page = await doc.getPage(i);
        var vp1 = page.getViewport({ scale: 1 });
        var vp = page.getViewport({ scale: maxWidth / vp1.width });
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(vp.width);
        canvas.height = Math.round(vp.height);
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        var blob = await new Promise(function (r) { canvas.toBlob(r, 'image/jpeg', 0.88); });
        out.push(new Uint8Array(await blob.arrayBuffer()));
        if (onProgress) onProgress(i, doc.numPages);
      }
      return out;
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
